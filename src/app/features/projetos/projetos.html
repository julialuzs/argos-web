<div class="mt-12 mx-8">
  <section class="flex justify-between">
    <h1 class="font-semibold text-3xl">Projetos</h1>
    <button pButton rounded variant="outlined" (click)="novoProjeto()">
      <svg data-p-icon="plus"></svg> Novo projeto
    </button>
  </section>

  <p-divider />

  <section>
    <p-dataview #dv [value]="projetos()" [rows]="5" [paginator]="true">
      <ng-template #list let-items>
        <div class="grid grid-cols-12 gap-4 grid-nogutter">
          @for (item of items; track item.id; let first = $first) {
            <div class="col-span-12">
              <div
                class="flex flex-col sm:flex-row sm:items-center p-5 gap-4"
                (class)="({ 'border-t border-surface-200 dark:border-surface-700': !first })"
              >
                <div class="flex flex-col md:flex-row justify-between md:items-center flex-1 gap-5">
                  <div class="flex flex-row md:flex-col justify-between items-start gap-2">
                    <div class="flex flex-row justify-between items-start gap-2">
                      <div class="font-medium text-surface-900 dark:text-surface-0 mt-1">
                        {{ item.nome }}
                      </div>

                      <p-divider layout="vertical" />

                      <div class="text-surface-900 dark:text-surface-0 mt-1">
                        {{ item.descricao }}
                      </div>
                    </div>
                  </div>
                  <div class="flex flex-col md:items-end gap-7">
                    <div class="flex flex-row-reverse md:flex-row gap-2">
                      <button
                        type="button"
                        pButton
                        class="flex-auto md:flex-initial whitespace-nowrap"
                        (click)="selecionarProjeto(item)"
                        [disabled]="projetoSelecionadoService.projetoSelecionado()?.id === item.id"
                      >
                        <svg data-p-icon="check" class="w-4 h-4"></svg>Selecionar
                      </button>

                      <button pButton iconOnly rounded variant="text" aria-label="Menu">
                        <svg data-p-icon="ellipsis-v"></svg>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          }
        </div>
      </ng-template>
    </p-dataview>
  </section>
</div>

<app-projeto-form [visivel]="projetoFormVisivel" />
