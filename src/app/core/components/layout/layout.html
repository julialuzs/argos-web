<header>
  <p-menubar [model]="items()" breakpoint="640px">
    <ng-template #start>
      <div
        class="flex size-6 shrink-0 items-center justify-center rounded-md bg-linear-to-br from-violet-500 to-indigo-600 text-white text-xs font-bold leading-none"
      >
        A
      </div>
    </ng-template>
    <ng-template #item let-item let-root="root">
      <a
        pRipple
        class="flex items-center px-3 py-2 gap-2"
        [class.cursor-pointer]="!item.disabled"
        [class.cursor-not-allowed]="item.disabled"
        [class.opacity-45]="item.disabled"
        [class.text-muted-color]="item.disabled"
        [class.text-primary]="!item.disabled && item.isActive()"
        [routerLink]="item.disabled ? null : item.routerLink"
        [attr.aria-disabled]="item.disabled ? true : null"
        [pTooltip]="item.disabledTooltip"
        [tooltipDisabled]="!item.disabled"
        tooltipPosition="bottom"
        (click)="onNavClick($event, item)"
      >
        <svg [pIcon]="item.icon"></svg>
        <span class="text-sm">{{ item.label }}</span>
        @if (item.badge) {
          <p-badge [class]="root ? '' : 'ms-auto'" [value]="item.badge" />
        }
        @if (item.shortcut) {
          <span
            class="ms-auto border border-surface rounded-sm bg-emphasis text-muted-color text-xs p-1"
            >{{ item.shortcut }}</span
          >
        }
        @if (item.items) {
          <i [class]="'ms-auto pi ' + (root ? 'pi-angle-down' : 'pi-angle-right')"></i>
        }
      </a>
    </ng-template>
    <ng-template #end>
      <div class="flex items-center gap-2">
        <button
          type="button"
          class="flex max-w-56 items-center gap-2 rounded-lg border border-surface px-2.5 py-1.5 text-left hover:bg-emphasis transition-colors"
          [attr.aria-label]="rotuloSeletorProjeto()"
          aria-haspopup="menu"
          (click)="abrirMenuProjeto($event)"
        >
          @if (projetoSelecionado(); as projeto) {
            <div
              class="flex size-6 shrink-0 items-center justify-center rounded-md bg-linear-to-br from-violet-500 to-indigo-600 text-white text-[0.6875rem] font-bold leading-none"
            >
              {{ projeto.nome | primeiraLetra }}
            </div>
            <span class="flex min-w-0 flex-col items-start leading-tight">
              <span class="text-[0.625rem] uppercase tracking-wide text-muted-color">Projeto</span>
              <span class="text-sm font-medium truncate max-w-36">{{ projeto.nome }}</span>
            </span>
            <svg [pIcon]="'chevron-down'" [size]="12" class="shrink-0 text-muted-color"></svg>
          } @else {
            <svg [pIcon]="'plus'" [size]="14" class="shrink-0"></svg>
            <span class="text-sm whitespace-nowrap">Selecione um projeto</span>
          }
        </button>
        <p-menu #menuProjeto [model]="itensMenuProjeto()" [popup]="true" appendTo="body" />
        <p-divider layout="vertical" />
        <p-toggleswitch
          inputId="alternar-tema"
          [ngModel]="temaService.temaEscuro()"
          (onChange)="temaService.alternar()"
          [ariaLabel]="temaService.temaEscuro() ? 'Ativar tema claro' : 'Ativar tema escuro'"
        >
          <ng-template #handle let-checked="checked">
            <svg [pIcon]="checked ? 'moon' : 'sun'" [size]="10"></svg>
          </ng-template>
        </p-toggleswitch>
        <button
          pButton
          variant="outlined"
          class="flex size-8 items-center justify-center rounded-md hover:bg-emphasis transition-colors"
          [attr.aria-label]="rotuloTamanhoFonte()"
          [attr.aria-expanded]="popoverTamanhoFonteAberto()"
          aria-haspopup="dialog"
          aria-controls="painel-tamanho-fonte"
          pTooltip="Tamanho da letra"
          tooltipPosition="bottom"
          (click)="abrirTamanhoFonte($event)"
        >
          <span class="text-sm font-semibold leading-none" aria-hidden="true">A+</span>
        </button>
        <p-popover
          #popoverTamanhoFonte
          (onShow)="popoverTamanhoFonteAberto.set(true)"
          (onHide)="popoverTamanhoFonteAberto.set(false)"
        >
          <div id="painel-tamanho-fonte" class="flex flex-col gap-2 p-1 min-w-52">
            <p id="titulo-tamanho-fonte" class="m-0 text-sm font-medium">Tamanho da letra</p>
            <p-selectbutton
              [options]="tamanhoFonteService.opcoes"
              optionLabel="rotulo"
              optionValue="valor"
              [allowEmpty]="false"
              [ngModel]="tamanhoFonteService.tamanhoFonte()"
              (onChange)="definirTamanhoFonte($event.value)"
              [ariaLabelledBy]="'titulo-tamanho-fonte'"
            >
              <ng-template #item let-opcao>
                <span class="flex flex-col items-center gap-0.5 px-1">
                  <span class="font-semibold leading-none" [style.font-size]="opcao.preview"
                    >A</span
                  >
                  <span class="text-xs leading-none">{{ opcao.rotulo }}</span>
                </span>
              </ng-template>
            </p-selectbutton>
          </div>
        </p-popover>
        <p-divider layout="vertical" />
        <span class="font-medium text-sm pr-2">{{ usuarioLogado()?.nome }}</span>
        <button
          pButton
          iconOnly
          variant="outlined"
          rounded
          aria-label="Sair da conta"
          (click)="logout()"
        >
          <svg data-p-icon="sign-out"></svg>
        </button>
      </div>
    </ng-template>
  </p-menubar>
</header>

<router-outlet />
